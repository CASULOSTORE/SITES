<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrinho | Karol & Léo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <nav class="site-nav">
    <a class="site-nav__brand" href="index.html">Karol <span>&amp;</span> Léo</a>

      <div class="cart-summary__total">

        <span id="cart-total">R$ 0</span>
      </div>
      <a href="pagamento.html" class="btn btn--primary btn--block">Finalizar e ir pro pagamento</a>

  <footer class="footer">
    <div class="footer__links">
      <a href="index.html">Início</a>
